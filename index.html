<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Ujian Sekolah - Siswa</title>
    <!-- Pustaka Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: #1e293b; line-height: 1.5; }
        .hidden { display: none !important; }

        .login-container {
            max-width: 400px; margin: 12vh auto; background: #fff; padding: 30px;
            border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .login-container h2 { margin-bottom: 20px; color: var(--primary); text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }

        #exam-page { user-select: none; }
        #watermark {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around;
            opacity: 0.06; font-size: 14px; font-weight: bold; color: #000;
            transform: rotate(-15deg); overflow: hidden;
        }
        .exam-layout { max-width: 1200px; margin: 20px auto; padding: 15px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        @media(max-width: 768px) { .exam-layout { grid-template-columns: 1fr; } }

        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .question-box { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; }
        .question-img { max-width: 100%; max-height: 250px; border-radius: 6px; margin-bottom: 15px; display: block; }
        .options label { display: block; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; }
        .options label:hover { background: #f1f5f9; border-color: var(--primary); }
        .options input { margin-right: 10px; }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .timer-box { text-align: center; }
        .timer { font-size: 1.8rem; font-weight: bold; color: var(--danger); margin-top: 5px; }
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .nav-btn { padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        .nav-btn.answered { background: var(--success); color: white; border-color: var(--success); }
        
        .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-sm { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN SISWA -->
    <div id="login-page" class="login-container">
        <h2>Login Ujian Siswa</h2>
        <div id="error-msg" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 10px; text-align: center;"></div>
        <div class="form-group">
            <label>NISN / Username</label>
            <input type="text" id="username" placeholder="Masukkan NISN Anda">
        </div>
        <div class="form-group">
            <label>Kode Login Ujian (Dari Guru)</label>
            <input type="text" id="exam-token" placeholder="Contoh: IPS1US1" style="text-transform: uppercase;">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Mulai Ujian</button>
    </div>

    <!-- HALAMAN RUANG UJIAN -->
    <div id="exam-page" class="hidden">
        <div id="watermark"></div>
        <div class="exam-layout">
            <div class="card">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
                    <span>Soal No. <span id="current-num">1</span> dari <span id="total-num">0</span></span>
                    <span style="color: #64748b;" id="student-info-header">Siswa: -</span>
                </div>
                <div class="question-box" id="question-text">Memuat soal dari server...</div>
                <div id="image-container"></div>
                <div class="options" id="options-box"></div>
                <div class="btn-group">
                    <button class="btn-sm" style="background:#e2e8f0;" onclick="prevQuestion()">Sebelumnya</button>
                    <button class="btn-sm" style="background:var(--warning); color:white;" onclick="markRagu()">Ragu-ragu</button>
                    <button class="btn-sm btn-primary" onclick="nextQuestion()">Selanjutnya</button>
                </div>
            </div>
            <div class="sidebar">
                <div class="card timer-box">
                    <span style="font-size: 0.85rem; color: #64748b;">Sisa Waktu</span>
                    <div class="timer" id="countdown-timer">00:45:00</div>
                </div>
                <div class="card">
                    <p style="font-weight: 600; font-size: 0.9rem;">Navigasi Soal</p>
                    <div class="nav-grid" id="nav-grid"></div>
                    <button class="btn" style="background:var(--danger); color:white; margin-top:20px;" onclick="promptSubmitExam()">Selesai & Kirim Ujian</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // INISIALISASI SUPABASE (Ganti dengan URL & Anon Key yang sama dari Supabase Anda)
        const SUPABASE_URL = 'https://supabase.com/tohyrtgsvkmhsdgpmpao';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvaHlydGdzdmttaHNkZ3BtcGFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1ODk1MzcsImV4cCI6MjEwOTE2NTUzN30.4fPubSHQHiVOrjdZeAxhy2S_r-oEtOIxeG65LplxrzA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let questions = [];
        let activeKodeKirim = "";
        let currentIdx = 0;
        let answers = {};
        let loggedInUser = "";
        let activeKodeLogin = "";

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const token = document.getElementById('exam-token').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-msg');

            if (!username || !token) {
                errorMsg.innerText = "NISN dan Kode Login wajib diisi!";
                return;
            }

            errorMsg.innerText = "Memeriksa kode ujian ke server...";

            // Ambil soal dari tabel soal_ujian berdasarkan kode_login
            let { data, error } = await _supabase
                .from('soal_ujian')
                .select('*')
                .eq('kode_login', token);

            if (error || !data || data.length === 0) {
                errorMsg.innerText = "Kode Login Ujian tidak ditemukan di server!";
                return;
            }

            // Simpan data soal dan kode kirim
            questions = data;
            activeKodeKirim = data[0].kode_kirim; // Ambil kode kirim dari paket soal
            activeKodeLogin = token;
            loggedInUser = username;

            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('exam-page').classList.remove('hidden');
            document.getElementById('student-info-header').innerText = `Siswa: ${username}`;

            triggerFullscreen();
            initExam();
        }

        function triggerFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            }
        }

        function initExam() {
            const wm = document.getElementById('watermark');
            for(let i=0; i<30; i++) {
                let span = document.createElement('span');
                span.innerText = `Siswa: ${loggedInUser} - CBT SECURE`;
                wm.appendChild(span);
            }

            let gridHTML = '';
            questions.forEach((_, i) => {
                gridHTML += `<button class="nav-btn" id="nav-${i}" onclick="loadQuestion(${i})">${i + 1}</button>`;
            });
            document.getElementById('nav-grid').innerHTML = gridHTML;
            document.getElementById('total-num').innerText = questions.length;

            loadQuestion(0);
            startTimer(2700); // 45 Menit
            initAntiCheat();
        }

        function loadQuestion(index) {
            currentIdx = index;
            document.getElementById('current-num').innerText = index + 1;
            document.getElementById('question-text').innerText = questions[index].pertanyaan;

            // Render Gambar jika ada
            let imgContainer = document.getElementById('image-container');
            if (questions[index].gambar_url) {
                imgContainer.innerHTML = `<img src="${questions[index].gambar_url}" class="question-img" alt="Ilustrasi Soal">`;
            } else {
                imgContainer.innerHTML = "";
            }

            let optHTML = '';
            let optionsArr = [
                questions[index].pilihan_a,
                questions[index].pilihan_b,
                questions[index].pilihan_c,
                questions[index].pilihan_d
            ];

            optionsArr.forEach((opt, i) => {
                if (opt) {
                    let checked = answers[index] === i ? 'checked' : '';
                    optHTML += `<label><input type="radio" name="opt" value="${i}" ${checked} onclick="saveAns(${index}, ${i})"> ${opt}</label>`;
                }
            });
            document.getElementById('options-box').innerHTML = optHTML;
            updateNavColor();
        }

        function saveAns(qIdx, optIdx) {
            answers[qIdx] = optIdx;
            updateNavColor();
        }

        function nextQuestion() { if(currentIdx < questions.length - 1) loadQuestion(currentIdx + 1); }
        function prevQuestion() { if(currentIdx > 0) loadQuestion(currentIdx - 1); }

        function updateNavColor() {
            questions.forEach((_, i) => {
                let btn = document.getElementById(`nav-${i}`);
                btn.className = "nav-btn";
                if(i === currentIdx) btn.classList.add('active');
                if(answers[i] !== undefined) btn.classList.add('answered');
            });
        }

        function startTimer(duration) {
            let timer = duration, hours, minutes, seconds;
            setInterval(() => {
                hours = Math.floor(timer / 3600);
                minutes = Math.floor((timer % 3600) / 60);
                seconds = timer % 60;
                document.getElementById('countdown-timer').innerText = 
                    `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                if (--timer < 0) {
                    alert("Waktu ujian habis!");
                    submitExamProcess();
                }
            }, 1000);
        }

        function initAntiCheat() {
            let violations = 0;
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    violations++;
                    alert(`PERINGATAN KEAMANAN (${violations}/3): Anda terdeteksi berpindah tab/aplikasi!`);
                    if (violations >= 3) {
                        alert("Ujian Anda didiskualifikasi karena terdeteksi curang.");
                        document.body.innerHTML = "<h1 style='text-align:center; margin-top:20vh; color:red;'>Ujian Ditutup: Pelanggaran Keamanan.</h1>";
                    }
                }
            });
        }

        function promptSubmitExam() {
            let kodeInput = prompt("Masukkan Kode Kirim Jawaban (Submit Key) dari Pengawas:");
            if (!kodeInput) return;

            if (kodeInput.trim().toUpperCase() !== activeKodeKirim) {
                alert("Kode Kirim Jawaban salah! Minta kode yang benar kepada pengawas.");
                return;
            }

            submitExamProcess();
        }

        async function submitExamProcess() {
            // Hitung Skor Otomatis
            let skorTotal = 0;
            let jumlahSoal = questions.length;

            questions.forEach((q, i) => {
                if (answers[i] === q.jawaban_benar) {
                    skorTotal += (100 / jumlahSoal);
                }
            });

            let nilaiAkhir = Math.round(skorTotal);

            // Kirim hasil ke tabel hasil_siswa di Supabase
            let { error } = await _supabase.from('hasil_siswa').insert([{
                nisn: loggedInUser,
                kode_login: activeKodeLogin,
                skor: nilaiAkhir,
                status: "Selesai"
            }]);

            if (error) {
                alert("Gagal mengirim nilai ke server: " + error.message);
            } else {
                alert(`Ujian Selesai! Nilai Anda berhasil dikirim ke database. Skor Anda: ${nilaiAkhir}`);
                location.reload();
            }
        }
    </script>
</body>
</html>
